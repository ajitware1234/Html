<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    <form>
        <fieldset style="width: 30%; margin: auto;">
            <h2>application form</h2> <br><br>
          
         


          <label>Name</label>
          <input type="text" placeholder="Enter full name" required><br><br>
          <label>email</label>
          <input type="email" placeholder="Enter your email" required><br><br>
          <label>password</label>
          <input type="password" placeholder="Enter your password" required><br><br>
          <label>number </label>
          <input type="number" placeholder="Enter your contact"><br><br>
          <label>dob</label>
          <input type="dob" placeholder="Enter your dob">    <br><br>
          <label>Gender</label>
          <input type="radio" name="Gender" value="Male">male
          <input type="radio" name="Gender" value="Female">Female   <br><br>
          <label>adderes</label>
          <input type="addres" placeholder="enter your adderes">     <br><br>

          state: <select name="state">
                 <option>select state</option>
                 <option>maharastra</option>
                 <option>up</option>
                 <option>gujrat</option>
                 <option>karnatak</option>
                 <option>bihar</option>
                 <option>goa</option>
                 <option>punjab</option>

          </select>
          <br><br>

         city: <select name="city">
                <option>select city</option>
                <option> ahilyangar</option>
                <option>sambhaji nagar</option>
                <option>pune</option>
                <option>mumbai</option>
          </select>   <br><br>

          Qualification: <select name="Qualification">
                         <option>select qualification</option>
                         <option>10th</option>
                         <option>12th</option>
                         <option>bsc</option>
                         <option>degree</option>
                         <option>diploma</option>
          </select>
                   <br><br>

          <label>upload photo</label>
           <input type="file"  placeholder="upload photo">    <br><br>

           <label>upload resume</label>
           <input type="file" placeholder="upload resume">  <br><br>

           <button type="submit" >button</button>    <br><br>
           

           <input type="submit" value="submit application"><br><br>



        </fieldset>
        
    </form>
    </fieldset>
</body>
</html>
