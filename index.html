<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

       <link rel="style"type="text/css"href="style.css">
  

   <style>
    p{
        color: aqua;
        background-color: blueviolet;
    }
     
   </style>

   <style>
        #abc
        {
            color: crimson;
            background-color: blue;
        }
     </style>

     <style>
        .xyz
        {
            color: yellow;
        }
     </style>

     <style>
        *
        {
            color: red;
        }
     </style>

     <style>
        h3,p {

            color: yellow;
            background-color: black;
    
        }
        
     </style>

</head>
<body>
     <!--inline css-->
    <h1 style="color: brown;">hello good morning</h1>

    <!--internal css-->
    <p>hello good morning have a nice day</p>

    
   
     <h1 id="abc">cascading sheet</h1>
     <h1 id="abc">cascading stylesheet</h1> 
     
    <h1 class="xyz"good morning>good morning</h1>
     <h1>hello</h1>

    <!--universal selector-->
   <h2>cascading stylesheet</h2>
   <p>this is heading</p>

   <!--group selector-->


   <h3>hello good morning</h3>
   <h4>hello</h4>
   <p>this is </p> 

</body>
</html>
