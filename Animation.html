<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: brown;
            position: relative;
            animation: myanimation 5s;
        }
        @keyframes myanimation
        {
            0%{background-color: brown;left: 0px;top: 0px;}
            25%{background-color: orange;left: 300px;top: 0px;}
            50%{background-color: purple;left:300px;top: 200px;}
            75%{background-color: blue;left: 0px;top: 200px;}
            100%{background-color: yellow;left: 0px;top: 0px;}
           
        }

    img{
         height: 200px;
            width: 200px;  
            background-color: brown;
            position: relative;
            animation: myfunction 5s;
    }
    @keyframes myfunction
    {
     0%{background-image: url(virat.jpg);left: 0px;top: 0px;}
     25%{background-image: url(virat.jpg);left: 300px;top: 0px;}
     50%{background-image: url(virat.jpg);left: 300px;top: 200px;}
     75%{background-image: url(back_image.jpg);left: 0px;top: 200px;}
     100%{background-image: url(back_image.jpg);left: 0px;top: 0px;}
    }
        
    </style>
</head>
<body>
    <div>

    </div>
    <br><br>
    <img src="virat.jpg" alt="">
</body>
</html>
